<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Pixel Warrior</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container">
        <div id="ui-layer" style="display: none;">
            <div class="health-wrapper">
                <div class="health-container">
                    <div class="health-label">SAMURAI</div>
                    <div class="health-bar-bg">
                        <div id="player-health" class="health-bar-fill"></div>
                    </div>
                </div>

                <div class="health-container">
                    <div class="health-label" style="text-align: right;">ENEMY</div>
                    <div class="health-bar-bg">
                        <div id="enemy-health" class="health-bar-fill" style="background-color: #e74c3c; width: 100%;"></div>
                    </div>
                </div>
            </div>    

            <div id="game-result" style="
                position: absolute; 
                color: white; 
                display: none; 
                align-items: center; 
                justify-content: center; 
                top: 0; right: 0; bottom: 0; left: 0; 
                font-size: 4rem; 
                text-shadow: 5px 5px #000;
                font-weight: bold;
                z-index: 10;">
                TIE
            </div>
        </div>

        <div id="main-menu" class="overlay">
            <h1 class="game-title">MINI PIXEL WARRIOR</h1>
            
            <div id="map-selection">
                <h2 class="sub-title">PILIH LOKASI PERTEMPURAN:</h2>
                <div class="map-grid">
                    <button class="map-btn active" data-map="map1.png">Himeji Forest</button>
                    <button class="map-btn" data-map="map2.png">Ethernal Eden Garden</button>
                    <button class="map-btn" data-map="map3.png">Nobunaga Castle</button>
                    <button class="map-btn" data-map="map4.png">Ruins of Astra Temple</button>
                </div>
            </div>

            <div class="menu-buttons">
                <button id="start-btn" class="pixel-btn">MULAI PETUALANGAN</button>
                <button id="options-btn" class="pixel-btn">PENGATURAN</button>
            </div>
        </div>

        <canvas id="gameCanvas" width="1280" height="720"></canvas>
    </div>

    <script src="js/utils.js"></script>
    <script src="js/classes.js"></script>
    <script src="js/script.js"></script>
</body>
</html>
