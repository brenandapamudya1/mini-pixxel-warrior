<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Pixel Warrior</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container">
        
        <div id="main-menu" class="overlay">
            <h1 class="game-title">MINI PIXEL WARRIOR</h1>
            
            <div id="init-interaction">
                <button id="enter-game-btn" class="pixel-btn" style="font-size: 1.5rem; padding: 20px 40px;">KLIK UNTUK MASUK</button>
            </div>

            <div id="actual-menu" class="menu-buttons" style="display: none;">
                <button id="to-setup-btn" class="pixel-btn">MULAI PERTARUNGAN</button>
                <button id="options-btn" class="pixel-btn">PENGATURAN</button>
            </div>
        </div>

        <div id="setup-screen" class="overlay" style="display: none;">
            <h2 class="setup-title">PERSIAPAN PERTEMPURAN</h2>
            
            <div class="setup-content">
                <div id="map-selection">
                    <h3 class="sub-title">1. PILIH LOKASI</h3>
                    <div class="map-grid">
                        <button class="map-btn active" data-map="map1.png">Himeji Forest</button>
                        <button class="map-btn" data-map="map2.png">Eternal Eden</button>
                        <button class="map-btn" data-map="map3.png">Nobunaga Castle</button>
                        <button class="map-btn" data-map="map4.png">Astra Ruins</button>
                    </div>
                </div>

                <div class="selection-row">
                    <h3 class="sub-title">2. PILIH HERO ANDA</h3>
                    <div class="char-grid" id="player-chars">
                        <button class="char-btn active" data-char="Samurai_Commander">Samurai</button>
                        <button class="char-btn" data-char="Knight_1">Knight</button>
                        <button class="char-btn" data-char="Kitsune">Kitsune</button>
                        <button class="char-btn" data-char="Red_Werewolf">Werewolf</button>
                        <button class="char-btn" data-char="Skeleton_Warrior">Skeleton</button>
                    </div>
                </div>

                <div class="selection-row">
                    <h3 class="sub-title">3. PILIH MUSUH</h3>
                    <div class="char-grid" id="enemy-chars">
                        <button class="char-btn" data-char="Samurai_Commander">Samurai</button>
                        <button class="char-btn" data-char="Knight_1">Knight</button>
                        <button class="char-btn" data-char="Kitsune">Kitsune</button>
                        <button class="char-btn active" data-char="Red_Werewolf">Werewolf</button>
                        <button class="char-btn" data-char="Skeleton_Warrior">Skeleton</button>
                    </div>
                </div>
            </div>

            <div class="menu-buttons setup-footer">
                <button id="start-game-btn" class="pixel-btn">MULAI BERTARUNG!</button>
                <button id="back-to-home" class="pixel-btn secondary">KEMBALI</button>
            </div>
        </div>

        <div id="options-screen" class="overlay" style="display: none;">
            <h2 class="setup-title">PENGATURAN</h2>
            
            <div class="options-container" style="width: 450px; background: rgba(0,0,0,0.6); padding: 30px; border: 2px solid #fff;">
                <div class="option-item" style="margin-bottom: 25px;">
                    <label style="color: #f1c40f; display: block; margin-bottom: 10px; font-weight: bold;">VOLUME MUSIK</label>
                    <div style="display: flex; align-items: center; gap: 15px;">
                        <input type="range" id="bgm-slider" min="0" max="1" step="0.1" value="0.5" style="flex: 1; cursor: pointer;">
                        <button id="mute-btn" class="pixel-btn" style="padding: 5px 10px; font-size: 0.7rem; min-width: 80px;">MUTE</button>
                    </div>
                </div>

                <div class="option-item" style="margin-bottom: 25px;">
                    <label style="color: #f1c40f; display: block; margin-bottom: 10px; font-weight: bold;">TINGKAT KESULITAN</label>
                    <select id="difficulty-select" class="pixel-btn" style="width: 100%; font-size: 0.8rem; padding: 5px; cursor: pointer;">
                        <option value="easy">MUDAH (AI Lambat)</option>
                        <option value="normal" selected>NORMAL</option>
                        <option value="hard">SULIT (AI Agresif)</option>
                    </select>
                </div>

                <div class="option-item">
                    <label style="color: #f1c40f; display: block; margin-bottom: 10px; font-weight: bold;">KONTROL SERANGAN</label>
                    <div style="color: white; font-size: 0.8rem; margin-bottom: 10px;">Tombol Saat Ini: <span id="current-attack-key" style="color: #e74c3c; font-weight: bold;">K</span></div>
                    <button id="change-key-btn" class="pixel-btn" style="width: 100%; font-size: 0.8rem;">GANTI TOMBOL SERANG</button>
                </div>
            </div>

            <div class="menu-buttons" style="margin-top: 30px;">
                <button id="close-options" class="pixel-btn">SIMPAN & KEMBALI</button>
            </div>
        </div>

        <div id="ui-layer" style="display: none;">
            <div class="health-wrapper">
                <div class="health-container">
                    <div id="player-name" class="health-label">SAMURAI</div>
                    <div class="health-bar-bg">
                        <div id="player-health" class="health-bar-fill"></div>
                    </div>
                </div>

                <div class="health-container">
                    <div id="enemy-name" class="health-label" style="text-align: right;">ENEMY</div>
                    <div class="health-bar-bg">
                        <div id="enemy-health" class="health-bar-fill" style="background-color: #e74c3c; width: 100%;"></div>
                    </div>
                </div>
            </div>    

            <div id="game-result">TIE</div>
            
            <div id="post-game-ui" style="display: none; text-align: center; margin-top: 20px;">
                <button id="restart-btn" class="pixel-btn">MAIN LAGI</button>
            </div>
        </div>

        <canvas id="gameCanvas" width="1280" height="720"></canvas>
    </div>

    <script src="js/classes.js"></script>
    <script src="js/script.js"></script>
</body>
</html>
